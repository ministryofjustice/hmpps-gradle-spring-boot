name: Publish
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        required: false
        default: '21'
permissions:
  contents: read
jobs:
  gradle-publish:
    name: Publish the gradle plugin
    environment: 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '${{ inputs.java-version }}'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Create gradle.properties
        shell: bash
        run: |
          echo "gradle.publish.key=${{ secrets.PUBLISH_KEY }}" > "$HOME/.gradle/gradle.properties"
          echo "gradle.publish.secret=${{ secrets.PUBLISH_SECRET }}" >> "$HOME/.gradle/gradle.properties"
      - name: Publish the plugin
        shell: bash
        run: ./gradlew publishPlugins
