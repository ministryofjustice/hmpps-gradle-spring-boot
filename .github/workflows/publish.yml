name: Publish
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        required: false
        default: '21'
permissions:
  contents: read
jobs:
  gradle-publish:
    name: Publish the gradle plugin
    environment: 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '${{ inputs.java-version }}'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Create gradle.properties
        shell: bash
        run: |
          echo "gradle.publish.key=${{ secrets.PUBLISH_KEY }}" > "$HOME/.gradle/gradle.properties"
          echo "gradle.publish.secret=${{ secrets.PUBLISH_SECRET }}" >> "$HOME/.gradle/gradle.properties"
      - name: Publish the plugin
        shell: bash
        run: ./gradlew publishPlugins
